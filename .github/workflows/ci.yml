name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time placeholders only; never used at runtime.
      PAYLOAD_SECRET: ci-placeholder-secret-not-used-at-runtime-000
      DATABASE_URI: file:./.data/ci.db
      DATA_DIR: ./.data
      MEDIA_DIR: ./.data/media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: mkdir -p .data/media
      - run: npm run generate:types
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Migrations apply to an empty database
        run: NODE_ENV=production DATABASE_URI=file:./.data/migrate-check.db npm run migrate
      # A collection or global changed without a migration (D23): migrate:create would then write a
      # new migration. It must say there is nothing to do and leave the migrations folder untouched.
      - name: Schema matches the migrations (no drift)
        env:
          DATABASE_URI: file:./.data/migrate-check.db
        run: |
          output="$(npx payload migrate:create drift_check < /dev/null 2>&1)" || true
          echo "$output"
          if ! echo "$output" | grep -q "No schema changes"; then
            echo "::error::The collections or globals have changes that no migration covers. Run 'npx payload migrate:create <name>' locally and commit the new files in migrations/."
            exit 1
          fi
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error::migrate:create wrote files into migrations/ even though it reported no changes."
            git status --porcelain migrations
            exit 1
          fi
      - run: npm run build
