name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time placeholders only; never used at runtime.
      PAYLOAD_SECRET: ci-placeholder-secret-not-used-at-runtime-000
      DATABASE_URI: file:./.data/ci.db
      DATA_DIR: ./.data
      MEDIA_DIR: ./.data/media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: mkdir -p .data/media
      - run: npm run generate:types
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Migrations apply to an empty database
        run: NODE_ENV=production DATABASE_URI=file:./.data/migrate-check.db npm run migrate
      # A collection or global changed without a migration (D23): migrate:create would then write a
      # new migration. It must say there is nothing to do and leave the migrations folder untouched.
      - name: Schema matches the migrations (no drift)
        env:
          DATABASE_URI: file:./.data/migrate-check.db
        run: |
          output="$(npx payload migrate:create drift_check < /dev/null 2>&1)" || true
          echo "$output"
          if ! echo "$output" | grep -q "No schema changes"; then
            echo "::error::The collections or globals have changes that no migration covers. Run 'npx payload migrate:create <name>' locally and commit the new files in migrations/."
            exit 1
          fi
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error::migrate:create wrote files into migrations/ even though it reported no changes."
            git status --porcelain migrations
            exit 1
          fi
      - run: npm run build
      # The Cloudflare build (D51): OpenNext must bundle the app for Workers, and the result must
      # fit the paid plan's 10 MB compressed limit. Neither step needs a Cloudflare account.
      - run: npm run cf:build
      - name: Worker fits the size limit
        run: |
          output="$(npm run --silent cf:size 2>&1)"
          echo "$output" | tail -n 20
          gzip_kib="$(echo "$output" | sed -n 's/.*gzip: \([0-9.]*\) KiB.*/\1/p' | tail -n 1)"
          if [ -z "$gzip_kib" ]; then echo "::error::Could not read the Worker size from wrangler's output."; exit 1; fi
          if [ "$(printf '%.0f' "$gzip_kib")" -gt 9500 ]; then echo "::error::The Worker is ${gzip_kib} KiB compressed; the limit is 10 MB."; exit 1; fi
      # The built Worker must actually serve pages (2026-11-26: Next 16.4.6 with OpenNext 1.20.7 built
      # and passed every check above, then returned 500 on every live page). Runs the Worker in
      # Cloudflare's local runtime with an empty local D1, migrated; no Cloudflare account needed.
      - name: Built Worker serves pages
        run: |
          printf 'PAYLOAD_SECRET=%s\nAPP_ENV=staging\n' "$PAYLOAD_SECRET" > .dev.vars
          npm run cf:migrate < /dev/null
          npx wrangler dev --local --port 8799 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 90); do curl -s -o /dev/null http://localhost:8799/admin/login && break; sleep 2; done
          failed=0
          for p in / /shop /build-a-basket /cart /gift-baskets /admin/login /sitemap.xml; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H 'cf-visitor: {"scheme":"https"}' "http://localhost:8799$p")"
            echo "$p $code"
            if [ "$code" != "200" ]; then failed=1; fi
          done
          if [ "$failed" = "1" ]; then echo "::error::The built Worker did not serve every page."; grep -iE "error|exception" wrangler-dev.log | head -40; exit 1; fi
