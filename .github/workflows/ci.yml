name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time placeholders only; never used at runtime.
      PAYLOAD_SECRET: ci-placeholder-secret-not-used-at-runtime-000
      DATABASE_URI: file:./.data/ci.db
      DATA_DIR: ./.data
      MEDIA_DIR: ./.data/media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: mkdir -p .data/media
      - run: npm run generate:types
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Migrations apply to an empty database
        run: NODE_ENV=production DATABASE_URI=file:./.data/migrate-check.db npx payload migrate
      - run: npm run build
